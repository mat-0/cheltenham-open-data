name: "IndexNow Submit"
description: "Submit sitemap URLs to IndexNow (Bing, Yandex, Seznam, Naver, etc.)"

inputs:
  site-url:
    description: "Base URL of the deployed site, e.g. https://example.com"
    required: true
  key:
    description: "IndexNow API key string"
    required: true
  sitemap-path:
    description: "Path to sitemap relative to site-url"
    required: false
    default: "/sitemap.xml"

runs:
  using: "composite"
  steps:
    - name: Submit URLs to IndexNow
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
        INDEXNOW_KEY: ${{ inputs.key }}
        SITEMAP_PATH: ${{ inputs.sitemap-path }}
      run: |
        set -euo pipefail

        HOST=$(echo "$SITE_URL" | sed -E 's~https?://([^/]+).*~\1~')
        SITEMAP_URL="${SITE_URL%/}${SITEMAP_PATH}"

        echo "Fetching sitemap: $SITEMAP_URL"
        HTTP_STATUS=$(curl -sL -w "%{http_code}" "$SITEMAP_URL" -o sitemap.xml)
        if [ "$HTTP_STATUS" -ge 400 ]; then
          echo "::error::Sitemap fetch failed with status $HTTP_STATUS at $SITEMAP_URL"
          exit 1
        fi

        URLS_JSON=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml \
          | python3 -c "import sys, json; print(json.dumps([l.strip() for l in sys.stdin]))")

        COUNT=$(echo "$URLS_JSON" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
        echo "Submitting $COUNT URLs to IndexNow"

        HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "{
                \"host\": \"${HOST}\",
                \"key\": \"${INDEXNOW_KEY}\",
                \"keyLocation\": \"https://${HOST}/${INDEXNOW_KEY}.txt\",
                \"urlList\": ${URLS_JSON}
              }")

        echo "Response HTTP $HTTP_STATUS:"
        cat response.txt

        if [ "$HTTP_STATUS" -ge 400 ]; then
          echo "::error::IndexNow submission failed with status $HTTP_STATUS"
          exit 1
        fi

        echo "IndexNow submission succeeded."

highlighter: rouge
permalink: ./:title
timezone: Europe/London
title: "Cheltenham Open Data"
description: "Local Data for Local People in Cheltenham and Gloucestershire"
author: "thechelsuk"
url: https://cheltenham-od.uk
icon: "/images/logo.png"
copyright: "Cheltenham Open Data - All data is owned by the respective data providers. No liability is accepted for the accuracy of the data."
encoding: UTF-8
future: false
repository: thechelsuk/uk.thechels.cod
defaultImagePath: "/images/logo.png"
github:
  repository_url: https://github.com/thechelsuk/uk.cheltenham-od
  branch: main
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-avatar
  - jekyll-github-metadata
exclude:
  - CNAME
  - README.md
  - LICENSE.md
  - SECURITY.md
  - requirements.txt
  - _python/
  - .github/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
include:
  - ".well-known"
  - "_pages"
  - ads.txt
  - style.css
  - theme.js

# --- Classifieds / adverts section. ---
collections:
  classifieds:
    output: true
    permalink: /ads/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: ./news/:title
  - scope:
      path: ""
      type: classifieds
    values:
      layout: advert
      robots: "noindex"

classified_categories:
  - value: "jobs"
    label: "Jobs"
  - value: "services"
    label: "Services"
  - value: "for-sale"
    label: "For sale"
  - value: "property"
    label: "Property"
  - value: "community"
    label: "Community notice"
  - value: "wanted"
    label: "Wanted"

feed:
  collections:
    posts:
      path: "/feeds/main.xml"
    classifieds:
      path: "/feeds/classifieds.xml"


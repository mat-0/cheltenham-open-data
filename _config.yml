highlighter: rouge
permalink: ./:title
title: "Cheltenham Open Data"
description: "// collecting and disseminating localised open data for Cheltenham and Gloucestershire"
author: "thechelsuk"
url: https://cheltenham-od.uk
icon: "/images/logo.png"
copyright: "Cheltenham Open Data - All data is owned by the respective data providers. No liability is accepted for the accuracy of the data."
encoding: UTF-8
future: false
repository: thechelsuk/uk.thechels.cod
defaultImagePath: "/images/logo.png"
github:
  repository_url: https://github.com/thechelsuk/uk.cheltenham-od
  branch: main
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-avatar
  - jekyll-github-metadata
exclude:
  - CNAME
  - README.md
  - LICENSE.md
  - SECURITY.md
  - requirements.txt
  - _python/
  - .github/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
include:
  - ".well-known"
  - "_pages"
  - ads.txt

# Site Navigation
## Header
navigation_header:
  - name: Latest News
    link: /cheltenham-news
  - name: Helplines and Contacts
    link: /cheltenham-helpful-contacts-reports
  - name: Cheapest Fuel Prices
    link: /cheltenham-fuel-prices
  - name: Fix My Street
    link: /cheltenham-fix-my-street
  - name: Flood Warnings
    link: /cheltenham-flood-warnings
  - name: Food Bank
    link: /cheltenham-foodbank-needed-items

{% include header.html %}
<div class="{{page.type}} herobar">
    <header class="{{page.type}} header">
        <h1>{{page.title}}</h1>
        <p>{{page.description}}</p>
    </header>

    {{ content }}

    <div class="scroll">
        <table id="planning-table" class="sortable">
            <thead>
                <tr>
                    <th data-sort="received_date">Date</th>
                    <th data-sort="description">Application</th>
                    <th data-sort="address">Location</th>
                    <th data-sort="postcode">Postcode</th>
                    <th data-sort="units">Units</th>
                    <th data-sort="status">Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- populated by JS from /assets/data/planning-applications.json -->
            </tbody>
        </table>
    </div>

    <p><a href="https://publicaccess.cheltenham.gov.uk/online-applications/">Cheltenham Borough Council Planning Portal</a></p>
    <script src="/scripts/planning-table.js"></script>
    {% include footer.html %}

{% include header.html %}

<div class="{{page.type}} herobar">
    <div class="{{page.type}}">
        <header class="{{page.type}} header">
            <h1>{{page.title}}</h1>
            <p>{{page.description}}</p>
            <ul>
                {% if page.feed_url %}
                <li><a href="{{ page.feed_url}}">Subscribe via our feed/rss →</a></li>
                {% endif %}
            </ul>
        </header>

        {{ content }}

    </div>
</div>

{% include footer.html %}
